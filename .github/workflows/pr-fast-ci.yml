name: PR Fast CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-fast-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-tests:
    name: Fast tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QMAKE_BIN: /usr/bin/qmake
      DMX_TEST_RUN_ID: ci-fast-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            qt5-qmake \
            qtbase5-dev

      - name: Install Python test dependencies
        run: python -m pip install --requirement requirements-test.txt

      - name: Run fast test suite
        run: ./scripts/test_fast.sh

      - name: Upload fast test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fast-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/**/metadata.txt
            test-results/**/status.txt
            test-results/**/*.log
            test-results/**/*.xml
          if-no-files-found: error
          retention-days: 14

  linux-build:
    name: Linux builds
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      QMAKE_BIN: /usr/bin/qmake
      DMX_TEST_RUN_ID: ci-build-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            pkg-config \
            qt5-qmake \
            qtbase5-dev \
            qtmultimedia5-dev \
            libqt5serialport5-dev \
            libopencv-dev \
            libavcodec-dev \
            libavdevice-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev \
            libswscale-dev

      - name: Build DMX and DMX_test
        run: ./scripts/test_build.sh

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-build-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/**/metadata.txt
            test-results/**/status.txt
            test-results/**/*.log
            test-results/**/*.sha256
          if-no-files-found: error
          retention-days: 14
