<text x="703" y="125" text-anchor="start" class="small" font-family="Noto Sans CJK SC" font-style="normal" font-weight="600">
<tspan x="703" dy="0">C</tspan>
</text>
<text x="1015.0" y="342.35" text-anchor="middle" class="normal" font-family="Noto Sans CJK SC" font-style="normal" font-weight="normal">
<tspan x="1015.0" dy="0"> </tspan>
</text>
<text x="1015" y="140" text-anchor="middle" class="small" font-family="Noto Sans CJK SC" font-style="normal" font-weight="normal">
<tspan x="1015" dy="0">环形全景坐标</tspan>
<tspan x="1015" dy="24">panoX←累计扫描行/转台角</tspan>
<tspan x="1015" dy="24">panoY←Sensor线坐标反向</tspan>
</text>
<line x1="735" y1="230" x2="1280" y2="230" stroke="#000" stroke-width="2"/>
<line x1="735" y1="335" x2="1280" y2="335" stroke="#000" stroke-width="2" stroke-dasharray="9 7"/>
<line x1="735" y1="500" x2="1280" y2="500" stroke="#000" stroke-width="2"/>
<text x="750" y="217" text-anchor="start" class="small" font-family="Noto Sans CJK SC" font-style="normal" font-weight="normal">
<tspan x="750" dy="0">按当前安装约定：顶部为较高视线（β为正）</tspan>
</text>
<text x="750" y="322" text-anchor="start" class="small" font-family="Noto Sans CJK SC" font-style="normal" font-weight="normal">
<tspan x="750" dy="0">主点候选 cy=2047.5／光轴 βrel=0°</tspan>
</text>
<text x="750" y="528" text-anchor="start" class="small" font-family="Noto Sans CJK SC" font-style="normal" font-weight="normal">
<tspan x="750" dy="0">底部：较低视线（β为负）</tspan>
</text>
<line x1="620" y1="225" x2="690" y2="225" class="line"/>
<polygon points="690,225 677.00,231.00 677.00,219.00" fill="#000"/>
<text x="360" y="610" text-anchor="middle" class="normal" font-family="Noto Sans CJK SC" font-style="normal" font-weight="normal">
<tspan x="360" dy="0">理想针孔模型</tspan>
<tspan x="360" dy="29">fy=Hp/[2tan(FOVv/2)]</tspan>
<tspan x="360" dy="29">βrel=atan2(cy-vu,fy)</tspan>
</text>
<rect x="760" y="635" width="500" height="130" rx="10" class="dash"/>
<text x="773" y="660" text-anchor="start" class="small" font-family="Noto Sans CJK SC" font-style="normal" font-weight="600">
<tspan x="773" dy="0">D</tspan>
</text>
<text x="1010.0" y="682.0" text-anchor="middle" class="small" font-family="Noto Sans CJK SC" font-style="normal" font-weight="normal">
<tspan x="1010.0" dy="0">已知参数与待标定项</tspan>
<tspan x="1010.0" dy="24">已确认FOVv=26.88°作用于panoY/Sensor Width</tspan>
<tspan x="1010.0" dy="24">待确认有效ROI；标定cy、畸变、姿态、通道偏移</tspan>
</text>
<text x="700" y="820" text-anchor="middle" class="small" font-family="Noto Sans CJK SC" font-style="normal" font-weight="normal">
<tspan x="700" dy="0">说明：已知总视场角只能换算理想相对视线角，不能替代绝对姿态标定</tspan>
</text>
<text x="700.0" y="876" text-anchor="middle" class="normal" font-family="Noto Sans CJK SC" font-style="normal" font-weight="600">
