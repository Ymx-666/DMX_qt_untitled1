<tspan x="187.5" dy="22">x原：Sensor线方向</tspan>
<tspan x="187.5" dy="22">对应垂直视场26.88°</tspan>
<tspan x="187.5" dy="22">y原：累计扫描行/时间</tspan>
</text>
<line x1="90" y1="185" x2="280" y2="185" stroke="#000" stroke-width="2"/>
<line x1="90" y1="185" x2="90" y2="485" stroke="#000" stroke-width="2"/>
