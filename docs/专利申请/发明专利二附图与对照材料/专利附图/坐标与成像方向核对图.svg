</text>
<line x1="125" y1="215" x2="125" y2="430" class="line"/>
<polygon points="125,430 119.00,417.00 131.00,417.00" fill="#000"/>
<text x="133" y="450" text-anchor="start" class="small" font-family="Noto Sans CJK SC" font-style="normal" font-weight="normal">
<tspan x="133" dy="0">+y原</tspan>
</text>
<rect x="390" y="165" width="230" height="120" rx="10" class="box"/>
<text x="403" y="190" text-anchor="start" class="small" font-family="Noto Sans CJK SC" font-style="normal" font-weight="600">
<tspan x="403" dy="0">B</tspan>
</text>
<text x="505.0" y="218.17499999999998" text-anchor="middle" class="normal" font-family="Noto Sans CJK SC" font-style="normal" font-weight="normal">
