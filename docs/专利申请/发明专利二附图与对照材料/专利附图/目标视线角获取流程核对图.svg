<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1030" viewBox="0 0 1400 1030">
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 Z" fill="#000"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#000}.box{fill:#fff;stroke:#000;stroke-width:2}.thin{fill:none;stroke:#000;stroke-width:1.5}.line{fill:none;stroke:#000;stroke-width:2}.dash{fill:none;stroke:#000;stroke-width:2;stroke-dasharray:9 7}.arrow{fill:none;stroke:#000;stroke-width:2;marker-end:url(#arrow)}.small{font-size:18px}.normal{font-size:22px}.large{font-size:27px;font-weight:600}.mono{font-family:monospace;font-size:18px}</style>
<rect x="1" y="1" width="1398" height="1028" fill="#fff" stroke="none"/>
<text x="700" y="45" text-anchor="middle" class="large" font-family="Noto Sans CJK SC" font-style="normal" font-weight="normal">
<tspan x="700" dy="0">目标检测框到视线角的获取流程（工程核对材料）</tspan>
</text>
<rect x="55" y="115" width="270" height="150" rx="10" class="box"/>
<text x="68" y="140" text-anchor="start" class="small" font-family="Noto Sans CJK SC" font-style="normal" font-weight="600">
<tspan x="68" dy="0">A1</tspan>
</text>
<text x="190.0" y="158.175" text-anchor="middle" class="small" font-family="Noto Sans CJK SC" font-style="normal" font-weight="normal">
<tspan x="190.0" dy="0">检测框中心</tspan>
<tspan x="190.0" dy="25">u=(x1+x2)/2</tspan>
<tspan x="190.0" dy="25">v=(y1+y2)/2</tspan>
<tspan x="190.0" dy="25">当前记录为panoX、panoY</tspan>
</text>
<rect x="390" y="115" width="270" height="150" rx="10" class="box"/>
<text x="403" y="140" text-anchor="start" class="small" font-family="Noto Sans CJK SC" font-style="normal" font-weight="600">
<tspan x="403" dy="0">A2</tspan>
</text>
<text x="525.0" y="159.85000000000002" text-anchor="middle" class="small" font-family="Noto Sans CJK SC" font-style="normal" font-weight="normal">
<tspan x="525.0" dy="0">线阵坐标链核对</tspan>
<tspan x="525.0" dy="24">panoY←Sensor Width轴</tspan>
<tspan x="525.0" dy="24">旋转/镜像及RGB/BW配准</tspan>
<tspan x="525.0" dy="24">得到校正坐标vu</tspan>
</text>
<line x1="325" y1="190" x2="390" y2="190" class="line"/>
<polygon points="390,190 377.00,196.00 377.00,184.00" fill="#000"/>
<rect x="725" y="90" width="285" height="200" rx="10" class="dash"/>
<text x="738" y="115" text-anchor="start" class="small" font-family="Noto Sans CJK SC" font-style="normal" font-weight="600">
<tspan x="738" dy="0">A3</tspan>
</text>
<text x="867.5" y="147.70000000000002" text-anchor="middle" class="small" font-family="Noto Sans CJK SC" font-style="normal" font-weight="normal">
<tspan x="867.5" dy="0">线阵空间轴标定</tspan>
<tspan x="867.5" dy="24">βrel=g&#x27;(panoY)</tspan>
<tspan x="867.5" dy="24">主点、像素焦距、畸变</tspan>
<tspan x="867.5" dy="24">RGB/BW分别标定</tspan>
<tspan x="867.5" dy="24">输出归一化视线</tspan>
</text>
<line x1="660" y1="190" x2="725" y2="190" class="line"/>
<polygon points="725,190 712.00,196.00 712.00,184.00" fill="#000"/>
<rect x="1075" y="115" width="270" height="150" rx="10" class="box"/>
<text x="1088" y="140" text-anchor="start" class="small" font-family="Noto Sans CJK SC" font-style="normal" font-weight="600">
<tspan x="1088" dy="0">A4</tspan>
</text>
<text x="1210.0" y="171.0" text-anchor="middle" class="small" font-family="Noto Sans CJK SC" font-style="normal" font-weight="normal">
<tspan x="1210.0" dy="0">相对视线角</tspan>
<tspan x="1210.0" dy="25">βrel=g&#x27;(panoY)</tspan>
<tspan x="1210.0" dy="25">仅相对于相机光轴</tspan>
</text>
<line x1="1010" y1="190" x2="1075" y2="190" class="line"/>
<polygon points="1075,190 1062.00,196.00 1062.00,184.00" fill="#000"/>
<rect x="125" y="375" width="430" height="155" rx="10" class="box"/>
<text x="138" y="400" text-anchor="start" class="small" font-family="Noto Sans CJK SC" font-style="normal" font-weight="600">
<tspan x="138" dy="0">B1</tspan>
</text>
<text x="340.0" y="422.35" text-anchor="middle" class="small" font-family="Noto Sans CJK SC" font-style="normal" font-weight="normal">
<tspan x="340.0" dy="0">只有总视场角时的理想估算</tspan>
<tspan x="340.0" dy="24">fy≈Hp/[2tan(FOVv/2)]</tspan>
<tspan x="340.0" dy="24">FOVv=26.88°，Hp=有效Width=4096</tspan>
<tspan x="340.0" dy="24">可得相对角；须标注“未标定”</tspan>
</text>
<polyline points="260,265 260,330 340,330 340,375" class="dash"/>
<polygon points="340,375 334.00,362.00 346.00,362.00" fill="#000"/>
<rect x="755" y="375" width="510" height="155" rx="10" class="box"/>
<text x="768" y="400" text-anchor="start" class="small" font-family="Noto Sans CJK SC" font-style="normal" font-weight="600">
<tspan x="768" dy="0">B2</tspan>
</text>
<text x="1010.0" y="420.67499999999995" text-anchor="middle" class="small" font-family="Noto Sans CJK SC" font-style="normal" font-weight="normal">
<tspan x="1010.0" dy="0">取得真实绝对高度角</tspan>
<tspan x="1010.0" dy="25">用外参/姿态Rworld←camera旋转视线向量</tspan>
<tspan x="1010.0" dy="25">βabs=atan2(rz,√(rx²+ry²))</tspan>
<tspan x="1010.0" dy="25">简化且滚转可忽略时：βabs≈βaxis+βrel</tspan>
</text>
<line x1="1210" y1="265" x2="1050" y2="375" class="line"/>
<polygon points="1050,375 1057.31,362.69 1064.11,372.58" fill="#000"/>
<rect x="80" y="650" width="350" height="150" rx="10" class="box"/>
<text x="93" y="675" text-anchor="start" class="small" font-family="Noto Sans CJK SC" font-style="normal" font-weight="600">
<tspan x="93" dy="0">C1</tspan>
</text>
<text x="255.0" y="693.175" text-anchor="middle" class="small" font-family="Noto Sans CJK SC" font-style="normal" font-weight="normal">
<tspan x="255.0" dy="0">输出级别一</tspan>
<tspan x="255.0" dy="25">理想相对视线角</tspan>
<tspan x="255.0" dy="25">仅FOV、图像尺寸和panoY</tspan>
<tspan x="255.0" dy="25">可用于当前算法试算</tspan>
</text>
<rect x="525" y="650" width="350" height="150" rx="10" class="box"/>
<text x="538" y="675" text-anchor="start" class="small" font-family="Noto Sans CJK SC" font-style="normal" font-weight="600">
<tspan x="538" dy="0">C2</tspan>
</text>
<text x="700.0" y="694.8499999999999" text-anchor="middle" class="small" font-family="Noto Sans CJK SC" font-style="normal" font-weight="normal">
<tspan x="700.0" dy="0">输出级别二</tspan>
<tspan x="700.0" dy="24">标定相对/绝对视线角</tspan>
<tspan x="700.0" dy="24">增加线阵射线模型、畸变、光轴姿态</tspan>
<tspan x="700.0" dy="24">可作为正式测角结果</tspan>
</text>
<rect x="970" y="650" width="350" height="150" rx="10" class="dash"/>
<text x="983" y="675" text-anchor="start" class="small" font-family="Noto Sans CJK SC" font-style="normal" font-weight="600">
<tspan x="983" dy="0">C3</tspan>
</text>
<text x="1145.0" y="693.175" text-anchor="middle" class="small" font-family="Noto Sans CJK SC" font-style="normal" font-weight="normal">
<tspan x="1145.0" dy="0">输出级别三</tspan>
<tspan x="1145.0" dy="25">目标物理高度/海拔</tspan>
<tspan x="1145.0" dy="25">还需距离、设备位置和地球模型</tspan>
<tspan x="1145.0" dy="25">仅凭单相机FOV不能得到</tspan>
</text>
<line x1="340" y1="530" x2="255" y2="650" class="line"/>
<polygon points="255,650 257.62,635.92 267.41,642.86" fill="#000"/>
<line x1="1010" y1="530" x2="700" y2="650" class="line"/>
<polygon points="700,650 709.96,639.71 714.29,650.90" fill="#000"/>
<polyline points="1050,530 1150,590 1150,650" class="dash"/>
<polygon points="1150,650 1144.00,637.00 1156.00,637.00" fill="#000"/>
<text x="700" y="875" text-anchor="middle" class="small" font-family="Noto Sans CJK SC" font-style="normal" font-weight="normal">
<tspan x="700" dy="0">目标框上下边缘分别换算后，其角度差可作为目标的垂直角尺寸</tspan>
</text>
<text x="700" y="915" text-anchor="middle" class="small" font-family="Noto Sans CJK SC" font-style="normal" font-weight="normal">
<tspan x="700" dy="0">当前软件正式构建需补：生产路径计算、标定版本、原始/绝对角字段及日志输出</tspan>
</text>
<text x="700.0" y="1006" text-anchor="middle" class="normal" font-family="Noto Sans CJK SC" font-style="normal" font-weight="600">
<tspan x="700.0" dy="0">工程测角流程图</tspan>
</text>
</svg>
