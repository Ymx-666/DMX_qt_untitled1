</text>
<rect x="325" y="645" width="750" height="115" rx="10" class="box"/>
<text x="338" y="670" text-anchor="start" class="small" font-family="Noto Sans CJK SC" font-style="normal" font-weight="600">
<tspan x="338" dy="0">301</tspan>
</text>
<text x="700.0" y="682.5" text-anchor="middle" class="small" font-family="Noto Sans CJK SC" font-style="normal" font-weight="normal">
<tspan x="700.0" dy="0">跨扫描周期重访</tspan>
<tspan x="700.0" dy="27">n=max(1,round(Δt/T))</tspan>
<tspan x="700.0" dy="27">周期残差 εT=|Δt-nT|≤Grevisit</tspan>
</text>
<text x="700" y="815" text-anchor="middle" class="normal" font-family="Noto Sans CJK SC" font-style="normal" font-weight="normal">
<tspan x="700" dy="0">三类关系分别采用不同的时间残差、空间门限和类别规则</tspan>
</text>
<text x="700.0" y="876" text-anchor="middle" class="normal" font-family="Noto Sans CJK SC" font-style="normal" font-weight="600">
