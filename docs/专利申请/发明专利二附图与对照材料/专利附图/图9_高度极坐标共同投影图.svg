<tspan x="273" dy="0">903</tspan>
</text>
<text x="700.0" y="779.15" text-anchor="middle" class="small" font-family="Noto Sans CJK SC" font-style="normal" font-weight="normal">
<tspan x="700.0" dy="0">背景逆采样v(β)与事件半径ρ(β)必须使用同一组参数；半径不表示目标距离或物理高度</tspan>
