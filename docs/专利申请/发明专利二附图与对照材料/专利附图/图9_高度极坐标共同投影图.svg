<text x="705.0" y="292.525" text-anchor="middle" class="small" font-family="Noto Sans CJK SC" font-style="normal" font-weight="normal">
<tspan x="705.0" dy="0">共同标定变换</tspan>
<tspan x="705.0" dy="25">fy=Hp/[2tan(FOVv/2)]</tspan>
<tspan x="705.0" dy="25">β=atan2(cy-vu,fy)</tspan>
<tspan x="705.0" dy="25">ρ=ρmin+(β-βmin)</tspan>
<tspan x="705.0" dy="25">/(βmax-βmin)×</tspan>
<tspan x="705.0" dy="25">(ρmax-ρmin)</tspan>
</text>
